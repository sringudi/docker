<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instaclone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fafafa;
      color: #262626;
      font-size: 14px;
    }

    /* ---------- TOP NAV ---------- */
    .topbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 60px;
      background: #fff;
      border-bottom: 1px solid #dbdbdb;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .topbar-inner {
      width: 100%;
      max-width: 975px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Inter', cursive;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #262626;
      text-decoration: none;
    }

    .search-box {
      position: relative;
      width: 268px;
    }

    .search-box input {
      width: 100%;
      height: 36px;
      background: #efefef;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 0 16px 0 40px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input:focus {
      background: #fff;
      border-color: #dbdbdb;
    }

    .search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #8e8e8e;
      font-size: 14px;
    }

    .nav-icons {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .nav-icons a {
      color: #262626;
      font-size: 1.4rem;
      text-decoration: none;
      transition: all 0.2s;
      position: relative;
    }

    .nav-icons a:hover { opacity: 0.6; }

    .avatar-nav {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #dbdbdb;
      cursor: pointer;
    }

    .nav-badge {
      position: absolute;
      top: -4px;
      right: -6px;
      background: #ed4956;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      min-width: 16px;
      height: 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
      border: 2px solid #fff;
    }

    /* ---------- LAYOUT ---------- */
    .main-container {
      max-width: 975px;
      margin: 0 auto;
      padding: 84px 20px 40px;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 32px;
    }

    /* ---------- STORIES ---------- */
    .stories {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      padding: 16px 0 16px 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories::-webkit-scrollbar { display: none; }

    .story {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 66px;
      flex-shrink: 0;
    }

    .story-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .story-ring.seen {
      background: #dbdbdb;
    }

    .story:hover .story-ring { transform: scale(1.05); }

    .story-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
    }

    .story-name {
      font-size: 12px;
      color: #262626;
      max-width: 66px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- POSTS ---------- */
    .feed { max-width: 614px; }

    .post {
      background: #fff;
      border: 1px solid #dbdbdb;
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .post-header {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 12px;
    }

    .post-header img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-header .username {
      font-weight: 600;
      font-size: 14px;
      flex: 1;
    }

    .post-header .username span {
      color: #8e8e8e;
      font-weight: 400;
      margin-left: 4px;
      font-size: 12px;
    }

    .post-header .more-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #262626;
      font-size: 1.1rem;
      padding: 4px;
    }

    .post-image {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #efefef;
      display: block;
    }

    .post-actions {
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .post-actions button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: #262626;
      padding: 0;
      transition: transform 0.15s;
    }

    .post-actions button:hover { transform: scale(1.1); }
    .post-actions button.liked { color: #ed4956; }

    .post-actions .bookmark-btn {
      margin-left: auto;
      font-size: 1.4rem;
    }

    .post-likes {
      padding: 0 16px 6px;
      font-weight: 600;
      font-size: 14px;
    }

    .post-caption {
      padding: 0 16px 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    .post-caption .username {
      font-weight: 600;
      margin-right: 6px;
    }

    .post-caption .hashtag {
      color: #00376b;
      text-decoration: none;
      font-weight: 500;
    }

    .post-time {
      padding: 0 16px 12px;
      font-size: 10px;
      color: #8e8e8e;
      text-transform: uppercase;
      letter-spacing: 0.2px;
    }

    .post-comments {
      padding: 0 16px 8px;
      font-size: 14px;
      color: #8e8e8e;
      cursor: pointer;
    }

    .add-comment {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid #efefef;
    }

    .add-comment input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: inherit;
      background: transparent;
    }

    .add-comment button {
      background: none;
      border: none;
      color: #0095f6;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.4;
      pointer-events: none;
      font-family: inherit;
    }

    .add-comment button.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ---------- SIDEBAR ---------- */
    .sidebar {
      position: sticky;
      top: 84px;
      height: fit-content;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px 0 20px;
    }

    .profile-card img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile-card .info { flex: 1; }
    .profile-card .info .name { font-weight: 600; font-size: 14px; }
    .profile-card .info .handle { color: #8e8e8e; font-size: 14px; }

    .profile-card .switch {
      color: #0095f6;
      font-weight: 600;
      font-size: 12px;
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .suggestions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0 12px;
    }

    .suggestions-header span:first-child {
      color: #8e8e8e;
      font-weight: 600;
      font-size: 14px;
    }

    .suggestions-header span:last-child {
      color: #262626;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
    }

    .suggestion {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
    }

    .suggestion img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .suggestion .info { flex: 1; }
    .suggestion .info .name { font-weight: 600; font-size: 14px; }
    .suggestion .info .reason { color: #8e8e8e; font-size: 12px; }

    .suggestion .follow-btn {
      color: #0095f6;
      font-weight: 600;
      font-size: 12px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }

    .sidebar-footer {
      margin-top: 24px;
      font-size: 11px;
      color: #c7c7c7;
      line-height: 1.8;
    }

    .sidebar-footer a {
      color: #c7c7c7;
      text-decoration: none;
      margin-right: 6px;
    }

    .sidebar-footer a:hover { text-decoration: underline; }

    .copyright {
      margin-top: 12px;
      font-size: 11px;
      color: #c7c7c7;
    }

    /* ---------- MOBILE BOTTOM NAV ---------- */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0;
      width: 100%;
      height: 52px;
      background: #fff;
      border-top: 1px solid #dbdbdb;
      z-index: 100;
      justify-content: space-around;
      align-items: center;
    }

    .mobile-nav a {
      color: #262626;
      font-size: 1.4rem;
      text-decoration: none;
      padding: 8px;
    }

    /* ---------- DOUBLE TAP HEART ---------- */
    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 80px;
      color: #fff;
      opacity: 0;
      pointer-events: none;
    }

    .heart-burst.animate {
      animation: heartPop 0.9s ease forwards;
    }

    @keyframes heartPop {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      15% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
      30% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
      70% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0; }
    }

    .post-image-wrap {
      position: relative;
      cursor: pointer;
    }

    /* ---------- RESPONSIVE ---------- */
    @media (max-width: 900px) {
      .main-container {
        grid-template-columns: 1fr;
        max-width: 614px;
      }
      .sidebar { display: none; }
      .search-box { display: none; }
    }

    @media (max-width: 640px) {
      .topbar { height: 54px; }
      .main-container { padding: 68px 0 60px; }
      .feed { max-width: 100%; }
      .stories {
        border-radius: 0;
        border-left: none;
        border-right: none;
        margin-bottom: 0;
      }
      .post {
        border-radius: 0;
        border-left: none;
        border-right: none;
        margin-bottom: 8px;
      }
      .mobile-nav { display: flex; }
      .nav-icons { gap: 18px; }
    }
  </style>
</head>
<body>

  <!-- TOP NAV -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#" class="logo">Instaclone</a>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" placeholder="Search">
      </div>
      <div class="nav-icons">
        <a href="#"><i class="far fa-heart"></i><span class="nav-badge">3</span></a>
        <a href="#"><i class="far fa-paper-plane"></i></a>
        <a href="#"><i class="far fa-plus-square"></i></a>
        <img class="avatar-nav" src="https://i.pravatar.cc/150?img=12" alt="Profile">
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="main-container">
    <div class="feed">

      <!-- STORIES -->
      <div class="stories" id="stories"></div>

      <!-- POSTS -->
      <div id="feed"></div>

    </div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="profile-card">
        <img src="https://i.pravatar.cc/150?img=12" alt="You">
        <div class="info">
          <div class="name">your_handle</div>
          <div class="handle">Your Name</div>
        </div>
        <button class="switch">Switch</button>
      </div>

      <div class="suggestions-header">
        <span>Suggested for you</span>
        <span>See All</span>
      </div>

      <div id="suggestions"></div>

      <div class="sidebar-footer">
        <a href="#">About</a> · <a href="#">Help</a> · <a href="#">Press</a> · <a href="#">API</a> ·
        <a href="#">Jobs</a> · <a href="#">Privacy</a> · <a href="#">Terms</a> · <a href="#">Locations</a> ·
        <a href="#">Language</a>
        <div class="copyright">© 2025 INSTACLONE FROM META</div>
      </div>
    </aside>
  </main>

  <!-- MOBILE BOTTOM NAV -->
  <nav class="mobile-nav">
    <a href="#"><i class="fas fa-home"></i></a>
    <a href="#"><i class="fas fa-search"></i></a>
    <a href="#"><i class="far fa-plus-square"></i></a>
    <a href="#"><i class="far fa-heart"></i></a>
    <a href="#"><img class="avatar-nav" src="https://i.pravatar.cc/150?img=12" alt=""></a>
  </nav>

  <script>
    // ---------- SAMPLE DATA ----------
    const stories = [
      { name: 'Your story', img: 'https://i.pravatar.cc/150?img=12', seen: true, isYou: true },
      { name: 'sarah_j', img: 'https://i.pravatar.cc/150?img=45', seen: false },
      { name: 'mike.photo', img: 'https://i.pravatar.cc/150?img=33', seen: false },
      { name: 'travel.kate', img: 'https://i.pravatar.cc/150?img=47', seen: true },
      { name: 'chef_anton', img: 'https://i.pravatar.cc/150?img=15', seen: false },
      { name: 'design_daily', img: 'https://i.pravatar.cc/150?img=22', seen: true },
      { name: 'nature_lens', img: 'https://i.pravatar.cc/150?img=68', seen: false },
      { name: 'urban.vibes', img: 'https://i.pravatar.cc/150?img=52', seen: true }
    ];

    const posts = [
      {
        id: 1,
        user: 'travel.kate',
        avatar: 'https://i.pravatar.cc/150?img=47',
        location: 'Santorini, Greece',
        image: 'https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?w=800&q=80',
        likes: 1284,
        liked: false,
        saved: false,
        caption: 'Golden hour never gets old here 🌅',
        hashtags: ['#santorini', '#travel', '#sunset'],
        time: '2 HOURS AGO',
        comments: 42
      },
      {
        id: 2,
        user: 'chef_anton',
        avatar: 'https://i.pravatar.cc/150?img=15',
        location: 'Brooklyn, NY',
        image: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80',
        likes: 892,
        liked: true,
        saved: false,
        caption: 'New menu drop this weekend. Truffle risotto anyone? 🍄',
        hashtags: ['#foodie', '#cheflife', '#brooklyn'],
        time: '4 HOURS AGO',
        comments: 18
      },
      {
        id: 3,
        user: 'nature_lens',
        avatar: 'https://i.pravatar.cc/150?img=68',
        location: 'Banff, Canada',
        image: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80',
        likes: 3421,
        liked: false,
        saved: true,
        caption: 'Woke up to this view. Worth every mile of the hike.',
        hashtags: ['#banff', '#mountains', '#wanderlust'],
        time: '6 HOURS AGO',
        comments: 87
      },
      {
        id: 4,
        user: 'urban.vibes',
        avatar: 'https://i.pravatar.cc/150?img=52',
        location: 'Tokyo, Japan',
        image: 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=800&q=80',
        likes: 2103,
        liked: false,
        saved: false,
        caption: 'Neon nights and endless alleys ✨',
        hashtags: ['#tokyo', '#streetphotography', '#neon'],
        time: '8 HOURS AGO',
        comments: 56
      }
    ];

    const suggestions = [
      { name: 'design_daily', reason: 'Followed by sarah_j', img: 'https://i.pravatar.cc/150?img=22' },
      { name: 'mike.photo', reason: 'Suggested for you', img: 'https://i.pravatar.cc/150?img=33' },
      { name: 'travel.kate', reason: 'Followed by chef_anton', img: 'https://i.pravatar.cc/150?img=47' },
      { name: 'urban.vibes', reason: 'Suggested for you', img: 'https://i.pravatar.cc/150?img=52' },
      { name: 'sarah_j', reason: 'Followed by nature_lens', img: 'https://i.pravatar.cc/150?img=45' }
    ];

    // ---------- RENDER STORIES ----------
    const storiesEl = document.getElementById('stories');
    storiesEl.innerHTML = stories.map(s => `
      <div class="story">
        <div class="story-ring ${s.seen ? 'seen' : ''}">
          <img src="${s.img}" alt="${s.name}">
        </div>
        <div class="story-name">${s.name}</div>
      </div>
    `).join('');

    // ---------- RENDER POSTS ----------
    function formatLikes(n) {
      return n.toLocaleString('en-US');
    }

    const feedEl = document.getElementById('feed');
    feedEl.innerHTML = posts.map(p => `
      <article class="post" data-id="${p.id}">
        <div class="post-header">
          <img src="${p.avatar}" alt="${p.user}">
          <div class="username">${p.user}<span>· ${p.location}</span></div>
          <button class="more-btn"><i class="fas fa-ellipsis-h"></i></button>
        </div>

        <div class="post-image-wrap" data-post="${p.id}">
          <img class="post-image" src="${p.image}" alt="Post by ${p.user}">
          <i class="fas fa-heart heart-burst"></i>
        </div>

        <div class="post-actions">
          <button class="like-btn ${p.liked ? 'liked' : ''}" data-post="${p.id}">
            <i class="${p.liked ? 'fas' : 'far'} fa-heart"></i>
          </button>
          <button class="comment-btn" data-post="${p.id}">
            <i class="far fa-comment"></i>
          </button>
          <button class="share-btn">
            <i class="far fa-paper-plane"></i>
          </button>
          <button class="bookmark-btn ${p.saved ? 'saved' : ''}" data-post="${p.id}">
            <i class="${p.saved ? 'fas' : 'far'} fa-bookmark"></i>
          </button>
        </div>

        <div class="post-likes" id="likes-${p.id}">${formatLikes(p.likes)} likes</div>

        <div class="post-caption">
          <span class="username">${p.user}</span>
          ${p.caption}
          ${p.hashtags.map(h => `<a href="#" class="hashtag">${h}</a>`).join(' ')}
        </div>

        <div class="post-comments">View all ${p.comments} comments</div>
        <div class="post-time">${p.time}</div>

        <div class="add-comment">
          <input type="text" placeholder="Add a comment..." data-input="${p.id}">
          <button data-post="${p.id}">Post</button>
        </div>
      </article>
    `).join('');

    // ---------- RENDER SUGGESTIONS ----------
    document.getElementById('suggestions').innerHTML = suggestions.map(s => `
      <div class="suggestion">
        <img src="${s.img}" alt="${s.name}">
        <div class="info">
          <div class="name">${s.name}</div>
          <div class="reason">${s.reason}</div>
        </div>
        <button class="follow-btn">Follow</button>
      </div>
    `).join('');

    // ---------- LIKE BUTTONS ----------
    document.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const postId = this.dataset.post;
        const post = posts.find(p => p.id == postId);
        const icon = this.querySelector('i');
        const likesEl = document.getElementById('likes-' + postId);

        if (post.liked) {
          post.liked = false;
          post.likes -= 1;
          this.classList.remove('liked');
          icon.className = 'far fa-heart';
        } else {
          post.liked = true;
          post.likes += 1;
          this.classList.add('liked');
          icon.className = 'fas fa-heart';
        }
        likesEl.textContent = formatLikes(post.likes) + ' likes';
      });
    });

    // ---------- BOOKMARK BUTTONS ----------
    document.querySelectorAll('.bookmark-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        const postId = this.dataset.post;
        const post = posts.find(p => p.id == postId);
        const icon = this.querySelector('i');

        post.saved = !post.saved;
        if (post.saved) {
          this.classList.add('saved');
          icon.className = 'fas fa-bookmark';
        } else {
          this.classList.remove('saved');
          icon.className = 'far fa-bookmark';
        }
      });
    });

    // ---------- DOUBLE TAP TO LIKE ----------
    document.querySelectorAll('.post-image-wrap').forEach(wrap => {
      let lastTap = 0;
      const postId = wrap.dataset.post;

      wrap.addEventListener('click', function () {
        const now = Date.now();
        if (now - lastTap < 300) {
          // Double tap detected
          const post = posts.find(p => p.id == postId);
          if (!post.liked) {
            const likeBtn = document.querySelector(`.like-btn[data-post="${postId}"]`);
            likeBtn.click();
          }
          // Heart animation
          const heart = wrap.querySelector('.heart-burst');
          heart.classList.remove('animate');
          void heart.offsetWidth; // reflow
          heart.classList.add('animate');
        }
        lastTap = now;
      });
    });

    // ---------- COMMENT INPUT ----------
    document.querySelectorAll('.add-comment input').forEach(input => {
      const btn = input.nextElementSibling;

      input.addEventListener('input', function () {
        if (this.value.trim().length > 0) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      input.addEventListener('keypress', function (e) {
        if (e.key === 'Enter' && this.value.trim().length > 0) {
          btn.click();
        }
      });

      btn.addEventListener('click', function () {
        if (input.value.trim().length > 0) {
          const postId = this.dataset.post;
          const post = posts.find(p => p.id == postId);
          post.comments += 1;
          const commentsEl = document.querySelector(`.post[data-id="${postId}"] .post-comments`);
          commentsEl.textContent = `View all ${post.comments} comments`;
          input.value = '';
          btn.classList.remove('active');
        }
      });
    });

    // ---------- FOLLOW BUTTONS ----------
    document.querySelectorAll('.follow-btn').forEach(btn => {
      btn.addEventListener('click', function () {
        if (this.textContent === 'Follow') {
          this.textContent = 'Following';
          this.style.color = '#8e8e8e';
        } else {
          this.textContent = 'Follow';
          this.style.color = '#0095f6';
        }
      });
    });
  </script>
</body>
</html>
