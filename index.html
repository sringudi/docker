<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brick Breaker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at 50% 30%, #1a1f3a, #0a0c16 70%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      overflow: hidden;
      user-select: none;
      padding: 16px;
    }

    .game-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 640px;
      padding: 0 4px;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .hud-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #6b7ba8;
      font-weight: 600;
    }

    .hud-value {
      font-size: 1.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #5e7cff, #b05eff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .lives {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 26px;
    }

    .life {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff5e9c;
      box-shadow: 0 0 12px rgba(255, 94, 156, 0.6);
      transition: all 0.3s;
    }

    .life.lost {
      background: #2a2f45;
      box-shadow: none;
    }

    canvas {
      background: #0d1120;
      border-radius: 20px;
      box-shadow: 0 30px 60px -20px rgba(94, 124, 255, 0.4),
                  0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      display: block;
      max-width: 100%;
      height: auto;
      cursor: none;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 22, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
      padding: 24px;
      transition: opacity 0.3s ease;
      z-index: 10;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay h2 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #5e7cff, #b05eff, #ff5e9c);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .overlay p {
      color: #9aa8bd;
      font-size: 0.95rem;
      max-width: 340px;
      line-height: 1.6;
    }

    .play-btn {
      background: linear-gradient(135deg, #5e7cff, #b05eff);
      color: #fff;
      border: none;
      padding: 14px 40px;
      border-radius: 60px;
      font-family: inherit;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 14px 30px -8px rgba(94, 124, 255, 0.6);
      letter-spacing: 0.02em;
    }

    .play-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 40px -10px rgba(94, 124, 255, 0.8);
    }

    .play-btn:active {
      transform: translateY(0);
    }

    .controls-hint {
      color: #556080;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .controls-hint kbd {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 0.75rem;
      color: #9aa8bd;
    }

    @media (max-width: 500px) {
      .hud-value { font-size: 1.1rem; }
      canvas { border-radius: 14px; }
      .overlay { border-radius: 14px; }
    }
  </style>
</head>
<body>

  <div class="game-wrap">
    <div class="hud">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="score">0</span>
      </div>
      <div class="hud-item" style="align-items: center;">
        <span class="hud-label">Lives</span>
        <div class="lives" id="lives"></div>
      </div>
      <div class="hud-item" style="align-items: flex-end;">
        <span class="hud-label">Level</span>
        <span class="hud-value" id="level">1</span>
      </div>
    </div>

    <canvas id="game" width="640" height="480"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">Brick Breaker</h2>
      <p id="overlayText">Move your paddle with the mouse or arrow keys. Break all the bricks to win!</p>
      <button class="play-btn" id="playBtn">Play Game</button>
      <div class="controls-hint">
        <kbd>←</kbd> <kbd>→</kbd> or move mouse
      </div>
    </div>
  </div>

  <script>
    // ---------- SETUP ----------
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const livesEl = document.getElementById('lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const playBtn = document.getElementById('playBtn');

    // ---------- GAME STATE ----------
    let state = 'menu'; // menu | playing | paused | gameover | win
    let score = 0;
    let lives = 3;
    let level = 1;

    // Paddle
    const paddle = {
      w: 110,
      h: 14,
      x: W / 2 - 55,
      y: H - 40,
      speed: 8,
      dx: 0,
      targetX: W / 2 - 55
    };

    // Ball
    const ball = {
      x: W / 2,
      y: H - 60,
      r: 8,
      speed: 5,
      dx: 0,
      dy: 0,
      trail: []
    };

    // Bricks
    let bricks = [];
    const brickConfig = {
      rows: 5,
      cols: 9,
      w: 0,
      h: 24,
      padding: 6,
      offsetTop: 60,
      offsetLeft: 0
    };

    const brickColors = [
      ['#ff5e9c', '#ff7eb0'],
      ['#b05eff', '#c48aff'],
      ['#5e7cff', '#7e98ff'],
      ['#5effc4', '#7effd4'],
      ['#ffb35e', '#ffc87e']
    ];

    // Keyboard
    const keys = { left: false, right: false };

    // ---------- INIT BRICKS ----------
    function initBricks() {
      bricks = [];
      const totalPadding = (brickConfig.cols - 1) * brickConfig.padding;
      brickConfig.w = (W - 40 - totalPadding) / brickConfig.cols;
      brickConfig.offsetLeft = 20;

      for (let r = 0; r < brickConfig.rows; r++) {
        for (let c = 0; c < brickConfig.cols; c++) {
          bricks.push({
            x: brickConfig.offsetLeft + c * (brickConfig.w + brickConfig.padding),
            y: brickConfig.offsetTop + r * (brickConfig.h + brickConfig.padding),
            w: brickConfig.w,
            h: brickConfig.h,
            row: r,
            alive: true,
            points: (brickConfig.rows - r) * 10
          });
        }
      }
    }

    // ---------- RESET BALL ----------
    function resetBall() {
      ball.x = W / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.dx = 0;
      ball.dy = 0;
      ball.trail = [];
      paddle.x = W / 2 - paddle.w / 2;
      paddle.targetX = paddle.x;
    }

    // ---------- LAUNCH BALL ----------
    function launchBall() {
      if (ball.dx !== 0 || ball.dy !== 0) return;
      const angle = (Math.random() * 0.6 - 0.3) + (-Math.PI / 2);
      ball.dx = Math.cos(angle) * ball.speed;
      ball.dy = Math.sin(angle) * ball.speed;
    }

    // ---------- START GAME ----------
    function startGame() {
      score = 0;
      lives = 3;
      level = 1;
      ball.speed = 5;
      updateHUD();
      initBricks();
      resetBall();
      state = 'playing';
      overlay.classList.add('hidden');
    }

    // ---------- NEXT LEVEL ----------
    function nextLevel() {
      level++;
      ball.speed = Math.min(ball.speed + 0.7, 11);
      updateHUD();
      initBricks();
      resetBall();
      state = 'playing';
      overlay.classList.add('hidden');
    }

    // ---------- UPDATE HUD ----------
    function updateHUD() {
      scoreEl.textContent = score;
      levelEl.textContent = level;
      livesEl.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        const dot = document.createElement('div');
        dot.className = 'life' + (i >= lives ? ' lost' : '');
        livesEl.appendChild(dot);
      }
    }

    // ---------- SHOW OVERLAY ----------
    function showOverlay(title, text, btnLabel) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      playBtn.textContent = btnLabel;
      overlay.classList.remove('hidden');
    }

    // ---------- COLLISION: CIRCLE vs RECT ----------
    function circleRectCollision(cx, cy, cr, rx, ry, rw, rh) {
      const closestX = Math.max(rx, Math.min(cx, rx + rw));
      const closestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - closestX;
      const dy = cy - closestY;
      return (dx * dx + dy * dy) < cr * cr;
    }

    // ---------- UPDATE ----------
    function update() {
      if (state !== 'playing') return;

      // Paddle movement (keyboard)
      if (keys.left) paddle.targetX -= paddle.speed;
      if (keys.right) paddle.targetX += paddle.speed;
      paddle.targetX = Math.max(0, Math.min(W - paddle.w, paddle.targetX));

      // Smooth paddle
      paddle.x += (paddle.targetX - paddle.x) * 0.25;

      // Ball follows paddle before launch
      if (ball.dx === 0 && ball.dy === 0) {
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - ball.r - 2;
        return;
      }

      // Move ball
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 10) ball.trail.shift();

      // Wall collisions
      if (ball.x - ball.r < 0) {
        ball.x = ball.r;
        ball.dx = Math.abs(ball.dx);
      }
      if (ball.x + ball.r > W) {
        ball.x = W - ball.r;
        ball.dx = -Math.abs(ball.dx);
      }
      if (ball.y - ball.r < 0) {
        ball.y = ball.r;
        ball.dy = Math.abs(ball.dy);
      }

      // Bottom — lose life
      if (ball.y - ball.r > H) {
        lives--;
        updateHUD();
        if (lives <= 0) {
          state = 'gameover';
          showOverlay('Game Over', `You scored ${score} points. Try again!`, 'Play Again');
        } else {
          resetBall();
        }
        return;
      }

      // Paddle collision
      if (ball.dy > 0 &&
          circleRectCollision(ball.x, ball.y, ball.r, paddle.x, paddle.y, paddle.w, paddle.h)) {

        // Determine bounce angle based on hit position
        const hitPos = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        const angle = hitPos * (Math.PI / 3); // max 60 degrees
        const speed = Math.hypot(ball.dx, ball.dy);

        ball.dx = speed * Math.sin(angle);
        ball.dy = -speed * Math.cos(angle);
        ball.y = paddle.y - ball.r - 1;
      }

      // Brick collisions
      let aliveCount = 0;
      for (const b of bricks) {
        if (!b.alive) continue;
        aliveCount++;

        if (circleRectCollision(ball.x, ball.y, ball.r, b.x, b.y, b.w, b.h)) {
          b.alive = false;
          score += b.points;
          updateHUD();

          // Determine bounce direction
          const ballCenterX = ball.x;
          const ballCenterY = ball.y;
          const brickCenterX = b.x + b.w / 2;
          const brickCenterY = b.y + b.h / 2;

          const dx = ballCenterX - brickCenterX;
          const dy = ballCenterY - brickCenterY;

          const overlapX = (b.w / 2 + ball.r) - Math.abs(dx);
          const overlapY = (b.h / 2 + ball.r) - Math.abs(dy);

          if (overlapX < overlapY) {
            ball.dx = -ball.dx;
            ball.x += dx > 0 ? overlapX : -overlapX;
          } else {
            ball.dy = -ball.dy;
            ball.y += dy > 0 ? overlapY : -overlapY;
          }
          break; // one brick per frame
        }
      }

      // Win check
      if (aliveCount === 0) {
        if (level < 3) {
          nextLevel();
        } else {
          state = 'win';
          showOverlay('You Win! 🏆', `Amazing! You cleared all levels with ${score} points.`, 'Play Again');
        }
      }
    }

    // ---------- DRAW ----------
    function draw() {
      // Clear with subtle gradient
      const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
      bgGrad.addColorStop(0, '#0d1120');
      bgGrad.addColorStop(1, '#0a0c16');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Grid glow
      ctx.strokeStyle = 'rgba(94, 124, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // Bricks
      for (const b of bricks) {
        if (!b.alive) continue;
        const colors = brickColors[b.row % brickColors.length];

        const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
        grad.addColorStop(0, colors[0]);
        grad.addColorStop(1, colors[1]);

        ctx.fillStyle = grad;
        ctx.shadowColor = colors[0];
        ctx.shadowBlur = 12;
        roundRect(ctx, b.x, b.y, b.w, b.h, 5);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Highlight
        ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
        roundRect(ctx, b.x + 2, b.y + 2, b.w - 4, 4, 2);
        ctx.fill();
      }

      // Paddle
      const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
      paddleGrad.addColorStop(0, '#7e98ff');
      paddleGrad.addColorStop(1, '#5e7cff');
      ctx.fillStyle = paddleGrad;
      ctx.shadowColor = '#5e7cff';
      ctx.shadowBlur = 20;
      roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 7);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Paddle highlight
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      roundRect(ctx, paddle.x + 4, paddle.y + 2, paddle.w - 8, 3, 1.5);
      ctx.fill();

      // Ball trail
      for (let i = 0; i < ball.trail.length; i++) {
        const t = ball.trail[i];
        const alpha = (i / ball.trail.length) * 0.4;
        const size = ball.r * (i / ball.trail.length);
        ctx.beginPath();
        ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 126, 176, ${alpha})`;
        ctx.fill();
      }

      // Ball
      const ballGrad = ctx.createRadialGradient(
        ball.x - 3, ball.y - 3, 1,
        ball.x, ball.y, ball.r
      );
      ballGrad.addColorStop(0, '#ffffff');
      ballGrad.addColorStop(1, '#ff7eb0');
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = ballGrad;
      ctx.shadowColor = '#ff5e9c';
      ctx.shadowBlur = 20;
      ctx.fill();
      ctx.shadowBlur = 0;

      // "Click to launch" hint
      if (state === 'playing' && ball.dx === 0 && ball.dy === 0) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        ctx.font = '600 14px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Click or press Space to launch', W / 2, H / 2 + 60);
      }
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // ---------- GAME LOOP ----------
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // ---------- INPUT: MOUSE / TOUCH ----------
    function handlePointerMove(clientX) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const x = (clientX - rect.left) * scaleX;
      paddle.targetX = x - paddle.w / 2;
      paddle.targetX = Math.max(0, Math.min(W - paddle.w, paddle.targetX));
    }

    canvas.addEventListener('mousemove', (e) => {
      if (state === 'playing') handlePointerMove(e.clientX);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (state === 'playing') {
        e.preventDefault();
        handlePointerMove(e.touches[0].clientX);
      }
    }, { passive: false });

    canvas.addEventListener('click', () => {
      if (state === 'playing') launchBall();
    });

    canvas.addEventListener('touchstart', (e) => {
      if (state === 'playing') {
        e.preventDefault();
        launchBall();
      }
    }, { passive: false });

    // ---------- INPUT: KEYBOARD ----------
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.key === ' ' || e.key === 'Spacebar') {
        e.preventDefault();
        if (state === 'playing') launchBall();
      }
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
    });

    // ---------- PLAY BUTTON ----------
    playBtn.addEventListener('click', () => {
      if (state === 'gameover' || state === 'win' || state === 'menu') {
        startGame();
      } else {
        state = 'playing';
        overlay.classList.add('hidden');
      }
    });

    // ---------- INIT ----------
    initBricks();
    resetBall();
    updateHUD();
    showOverlay('Brick Breaker', 'Move your paddle with the mouse or arrow keys. Break all the bricks to win!', 'Play Game');
    loop();
  </script>
</body>
</html>
